<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecipeShare - Cook it. Share it.</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- css  -->
    <link href="../style.css" rel="stylesheet" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <div class="text-center mb-4">
        <a class="brand fs-3" href="index.html">Recipe<span>Share</span></a>
        <h1 class="h3 fw-bold mt-3 mb-1">Create your account</h1>
        <p class="text-secondary mb-0">
          Share your recipes and discover new ones.
        </p>
      </div>

      <!-- Error / success messages will be shown here later -->
      <div id="formMessage" class="alert d-none" role="alert"></div>

      <form id="signupForm">
        <div class="mb-3">
          <label for="fullName" class="form-label fw-semibold">Your name</label>
          <input
            type="text"
            class="form-control"
            id="fullName"
            name="full_name"
            autocomplete="name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="signupEmail" class="form-label fw-semibold">Email</label>
          <input
            type="email"
            class="form-control"
            id="signupEmail"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <div class="mb-3">
          <label for="signupPassword" class="form-label fw-semibold"
            >Password</label
          >
          <input
            type="password"
            class="form-control"
            id="signupPassword"
            name="password"
            minlength="6"
            autocomplete="new-password"
            required
          />
          <div class="form-text">Use at least 6 characters.</div>
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label fw-semibold"
            >Repeat password</label
          >
          <input
            type="password"
            class="form-control"
            id="confirmPassword"
            name="confirm_password"
            minlength="6"
            autocomplete="new-password"
            required
          />
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 py-2 fw-bold"
          id="createAccountBtn"
        >
          Create account
        </button>
      </form>

      <p class="text-center text-secondary mt-4 mb-0">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </main>

    <!-- links  -->
    <!-- Bootstrap's own script  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../app.js"></script>
    <!-- links  -->
  </body>
</html>
