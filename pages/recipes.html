<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Recipes - RecipeShare</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../style.css" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR (public page: JS shows the right links) -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand brand" href="../index.html">Recipe<span>Share</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active fw-bold" href="recipes.html" aria-current="page">All Recipes</a></li>

          <!-- logged out -->
          <li class="nav-item guest-only"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item guest-only"><a class="btn btn-primary rounded-pill px-4" href="signup.html">Sign up</a></li>

          <!-- logged in -->
          <li class="nav-item user-only d-none"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item user-only d-none"><a class="nav-link" href="my-recipes.html">My Recipes</a></li>
          <li class="nav-item user-only d-none"><button type="button" class="btn btn-outline-secondary rounded-pill px-4" id="logoutBtn">Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-lg-5">

    <h1 class="h2 fw-bold mb-1">All recipes</h1>
    <p class="text-secondary mb-4">Search by title or pick a category.</p>

    <!-- SEARCH + FILTER -->
    <form id="filterForm" action="recipes.html" method="get" class="form-card p-3 mb-4" role="search">
      <div class="row g-2">
        <div class="col-md-6">
          <input type="search" class="form-control" id="searchInput" name="q" placeholder="Search recipes by title" aria-label="Search recipes by title">
        </div>
        <div class="col-md-4">
          <select class="form-select" id="categoryFilter" name="category" aria-label="Filter by category">
            <option value="">All categories</option>
            <option value="Pakistani">Pakistani</option>
            <option value="Italian">Italian</option>
            <option value="Chinese">Chinese</option>
            <option value="Desserts">Desserts</option>
            <option value="Fast Food">Fast Food</option>
            <option value="Healthy">Healthy</option>
          </select>
        </div>
        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-primary">Search</button>
        </div>
      </div>
    </form>

    <!-- The recipes are added here by JS -->
    <div class="row g-4" id="allRecipes">

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../app.js"></script>
</body>
</html>
