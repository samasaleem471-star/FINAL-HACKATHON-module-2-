<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Recipes - RecipeShare</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../style.css" rel="stylesheet">
</head>
<body>
    
 <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand brand" href="../index.html"
          >Recipe<span>Share</span></a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="recipes.html">All Recipes</a>
            </li>

            <!-- logged out -->
            <li class="nav-item guest-only">
              <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item guest-only">
              <a class="btn btn-primary rounded-pill px-4" href="signup.html"
                >Sign up</a
              >
            </li>

            <!-- logged in -->
            <li class="nav-item user-only d-none">
              <a class="nav-link" href="dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item user-only d-none">
              <a class="nav-link" href="my-recipes.html">My Recipes</a>
            </li>
            
            <li class="nav-item user-only d-none">
              <button
                type="button"
                class="btn btn-outline-secondary rounded-pill px-4"
                id="logoutBtn"
              >
                Logout
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>



  <main class="container py-4 py-lg-5">

    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm rounded-pill mb-4">
      <i class="bi bi-arrow-left me-1"></i>Back
    </a>

    <!-- Filled in by JS -->
    <div id="recipeDetails">

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="recipe-img recipe-img-lg d-flex align-items-center justify-content-center rounded-4" id="recipeImg">
            🍽️
          </div>
        </div>

        <div class="col-lg-6">
          <span class="badge badge-cat rounded-pill px-3 mb-2" id="recipeCategory">Category</span>
          <h1 class="h2 fw-bold mb-3" id="recipeTitle">Recipe title</h1>
          <p class="text-secondary mb-4" id="recipeDescription">Description goes here.</p>

          <div class="d-flex gap-4 mb-4 small text-secondary">
            <span><i class="bi bi-clock me-1"></i><span id="recipeTime"></span> min</span>
            <span><i class="bi bi-person me-1"></i><span id="recipeAuthor"></span></span>
            <span><i class="bi bi-calendar3 me-1"></i><span id="recipeDate"></span></span>
          </div>
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-lg-8">
          <h2 class="h4 fw-bold mb-3">Instructions</h2>
          <p class="text-secondary" id="recipeInstructions" style="white-space: pre-line;"></p>
        </div>
      </div>

    </div>

    <!-- Shown only if recipe not found / still loading -->
    <p class="text-secondary d-none" id="recipeNotFound">Recipe not found.</p>

  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../app.js"></script>
</body>
</html>
